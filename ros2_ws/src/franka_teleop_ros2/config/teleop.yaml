# Parameters loaded under each node namespace via bringup launch.
mock_landmark_publisher:
  ros__parameters:
    rate_hz: 20.0
    image_width: 640
    image_height: 480
    topic: "/perception/landmarks"
    motion_scale: 0.14

human_to_robot_mapper:
  ros__parameters:
    landmarks_topic: "/perception/landmarks"
    target_topic: "/teleop/target_pose"
    rejected_topic: "/teleop/mapping_rejected"
    mapping_mode: "shoulder_relative"
    min_landmark_confidence: 0.5
    # Depth is visualization-only; not used for control in this demo.
    use_metric_depth: false
    base_frame: "panda_link0"
    workspace_origin: [0.40, 0.0, 0.45]
    workspace_scale: [0.45, 0.50, 0.30]
    filter_alpha: 0.35
    max_linear_velocity: 0.25
    workspace.x_min: 0.25
    workspace.x_max: 0.70
    workspace.y_min: -0.35
    workspace.y_max: 0.35
    workspace.z_min: 0.10
    workspace.z_max: 0.70
    fixed_orientation_rpy: [3.14159, 0.0, 0.0]
    fx: 600.0
    fy: 600.0
    cx: 320.0
    cy: 240.0

safety_monitor:
  ros__parameters:
    input_topic: "/teleop/target_pose"
    output_topic: "/teleop/command_pose"
    status_topic: "/teleop/safety_status"
    control_mode: "simulation"
    allow_real_robot: false
    require_deadman: false
    max_command_hz: 30.0
    pose_timeout_sec: 0.75
    command_stale_sec: 0.25
    watchdog_hz: 10.0
    workspace_mode: "clamp"
    workspace.x_min: 0.25
    workspace.x_max: 0.70
    workspace.y_min: -0.35
    workspace.y_max: 0.35
    workspace.z_min: 0.10
    workspace.z_max: 0.70
    max_linear_velocity: 0.25

robot_controller:
  ros__parameters:
    mode: "joint_ik"
    input_topic: "/teleop/command_pose"
    trajectory_topic: "/panda_arm_controller/joint_trajectory"
    status_topic: "/teleop/controller_status"
    allow_real_robot: false
    trajectory_time_sec: 0.30
    hold_time_sec: 0.10
    blend_alpha: 0.35
    publish_joint_states_fallback: true
    joint_states_topic: "/joint_states"

target_visualizer:
  ros__parameters:
    target_topic: "/teleop/target_pose"
    command_topic: "/teleop/command_pose"
    marker_topic: "/teleop/markers"

diagnostics:
  ros__parameters:
    window_sec: 6.0
    output_json: ""
