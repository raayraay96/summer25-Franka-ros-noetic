# Private parameters for human_to_robot_mapper_node.py
mapping_mode: "shoulder_relative"
min_landmark_confidence: 0.5
use_metric_depth: false
relative_depth_scale: 1.0
relative_depth_offset: 0.8
base_frame: "panda_link0"
camera_frame: "camera_optical_frame"
workspace_origin: [0.45, 0.0, 0.45]
workspace_scale: [0.55, 0.55, 0.35]
workspace_mode: "reject"
workspace:
  x_min: 0.25
  x_max: 0.75
  y_min: -0.40
  y_max: 0.40
  z_min: 0.05
  z_max: 0.80
pose_timeout_sec: 0.5
filter_alpha: 0.3
max_linear_velocity: 0.20
fixed_orientation_rpy: [3.14159, 0.0, 0.0]
landmarks_topic: "/pose_estimator_node/landmarks"
# EXAMPLE calibration values. Replace with measured camera calibration.
image_width: 640
image_height: 480
fx: 600.0
fy: 600.0
cx: 320.0
cy: 240.0
camera_in_base_xyz: [0.5, 0.0, 0.8]
camera_in_base_rpy: [3.14159, 0.0, 0.0]
