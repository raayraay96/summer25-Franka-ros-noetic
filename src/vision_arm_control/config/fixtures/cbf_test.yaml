# CBF test mode: experimental cbf_qp filter with an obstacle, dry_run.
schema_version: "1.0"
dt: 0.05
initial_position: [0.45, 0.0, 0.45]
retargeter:
  name: sew_orientation
  treat_z_as_image_relative: true
workspace:
  x_min: 0.25
  x_max: 0.75
  y_min: -0.40
  y_max: 0.40
  z_min: 0.05
  z_max: 0.80
safety:
  mode: cbf_qp
  alpha: 4.0
  workspace_margin_m: 0.03
  per_axis_velocity_limit_mps: 0.20
  allow_projection_fallback: false
  stop_on_solver_failure: true
  obstacles:
    - id: demo_sphere
      center: [0.48, 0.0, 0.35]
      radius_m: 0.10
      margin_m: 0.05
backend: dry_run
