# Shoulder-relative demo (preserved baseline), clamp safety, dry_run.
schema_version: "1.0"
dt: 0.05
initial_position: [0.45, 0.0, 0.45]
retargeter:
  name: shoulder_relative
  treat_z_as_image_relative: true
workspace:
  x_min: 0.25
  x_max: 0.75
  y_min: -0.40
  y_max: 0.40
  z_min: 0.05
  z_max: 0.80
safety:
  mode: clamp
  workspace_margin_m: 0.02
backend: dry_run
frame_mapping:
  source_frame: image_normalized
  target_frame: robot_base
