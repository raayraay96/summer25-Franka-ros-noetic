# Default safe mode: reject filter, dry_run backend, legacy shoulder_relative.
schema_version: "1.0"
dt: 0.05
initial_position: [0.45, 0.0, 0.45]
retargeter:
  name: shoulder_relative
  treat_z_as_image_relative: true
  image_relative_z_scale: 0.5
workspace:
  x_min: 0.25
  x_max: 0.75
  y_min: -0.40
  y_max: 0.40
  z_min: 0.05
  z_max: 0.80
safety:
  mode: reject
  workspace_margin_m: 0.0
  stop_on_solver_failure: true
backend: dry_run
