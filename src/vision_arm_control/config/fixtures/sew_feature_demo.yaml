# SEW feature demo (feature-level; no joint IK), reject safety, dry_run.
schema_version: "1.0"
dt: 0.05
initial_position: [0.45, 0.0, 0.45]
retargeter:
  name: sew_orientation
  treat_z_as_image_relative: true
  image_relative_z_scale: 0.5
workspace:
  x_min: 0.25
  x_max: 0.75
  y_min: -0.40
  y_max: 0.40
  z_min: 0.05
  z_max: 0.80
safety:
  mode: reject
backend: dry_run
frame_mapping:
  source_frame: image_normalized
  target_frame: robot_base
