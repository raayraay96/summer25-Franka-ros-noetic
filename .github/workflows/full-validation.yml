name: Full validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Unit tests and repository validation
        run: make test validate
      - name: Full 6,000-seed QP oracle audit
        run: make qp-audit
      - name: Full 30-replicate paired benchmark
        run: make benchmark-full
      - name: Write job summary
        if: always()
        run: |
          echo "## Franka full validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- 6,000-seed QP correctness audit" >> "$GITHUB_STEP_SUMMARY"
          echo "- 30-replicate paired simulation benchmark" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: **${{ job.status }}**" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-validation-evidence
          path: |
            results/v1.1-hardening/paired/
            results/v1.1-hardening/qp-cross-validation.json
          if-no-files-found: warn
