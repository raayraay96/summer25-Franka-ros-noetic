name: test

on:
  push:
    branches: [main, portfolio-v2]
  pull_request:
    branches: [main, portfolio-v2]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest PyYAML
      - name: Run unit tests
        run: |
          python -m pytest -q tests/
      - name: Run mapping benchmark (smoke)
        run: |
          python benchmarks/benchmark_mapping.py
          test -f results/mapping_benchmark.json
