name: CI
on:
  push:
    branches: [main, portfolio-v2, research-retargeting-v1.1, portfolio-observability-mvp]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install quality dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Pure logic + property + oracle tests
        run: python -m pytest -q tests/
      - name: QP solver cross-validation vs trusted oracle (smoke)
        run: |
          mkdir -p results/v1.1-ci
          python scripts/qp_cross_validation.py --generic 400 --cbf 400 \
            --output results/v1.1-ci/qp-cross-validation-smoke.json
      - name: Config and documentation validation
        run: python scripts/validate_repository.py
      - name: Teleop config-schema validation (fixtures)
        run: python scripts/validate_config.py
      - name: Reproduce CPU baselines
        run: |
          python benchmarks/benchmark_mapping.py
          python benchmarks/benchmark_latency.py
      - name: v1.1 benchmark smoke + schema validation
        run: |
          python benchmarks/benchmark_retargeting_v11.py --smoke --output results/v1.1-ci
          python - <<'PY'
          import json, csv
          from pathlib import Path
          root = Path("results/v1.1-ci")
          summary = json.loads((root / "benchmark-summary.json").read_text())
          assert "aggregate_by_combo" in summary
          assert summary["n_rows"] > 0
          env = json.loads((root / "environment.json").read_text())
          assert "python" in env and "command" in env
          with (root / "benchmark-runs.csv").open() as f:
              rows = list(csv.DictReader(f))
          assert rows, "empty benchmark-runs.csv"
          required = {
              "retargeter", "safety", "trajectory",
              "mapping_latency_mean_ms", "intervention_count",
              "solver_failure_count", "dropped_command_count",
          }
          assert required.issubset(rows[0].keys()), rows[0].keys()
          print(f"schema ok: {len(rows)} rows, combos={list(summary['aggregate_by_combo'])}")
          PY
      - name: Black
        run: black --check src/vision_arm_control/src tests benchmarks scripts ros2_ws/src/franka_teleop_ros2
      - name: Flake8
        run: flake8 src/vision_arm_control/src tests benchmarks scripts ros2_ws/src/franka_teleop_ros2
      - name: History and large-object audit
        run: bash scripts/audit_git_history.sh
      - name: Write quality summary
        if: always()
        run: |
          echo "## Franka portfolio CI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pure-Python tests and telemetry queue tests" >> "$GITHUB_STEP_SUMMARY"
          echo "- 800-case QP oracle smoke audit" >> "$GITHUB_STEP_SUMMARY"
          echo "- Benchmark, config, documentation, formatting, and history checks" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: **${{ job.status }}**" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload CI artifacts (benchmark + QP oracle smoke)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1.1-ci-artifacts
          path: results/v1.1-ci/
          if-no-files-found: ignore
  noetic-container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build ROS Noetic image
        run: docker build -t franka-teleop:noetic .
      - name: Run catkin and dry-run launch smoke test
        run: docker run --rm franka-teleop:noetic bash scripts/ci_smoke_noetic.sh
