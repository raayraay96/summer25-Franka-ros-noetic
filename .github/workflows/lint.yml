name: lint

on:
  push:
    branches: [main, portfolio-v2, portfolio-polish]
  pull_request:
    branches: [main, portfolio-v2]

jobs:
  python-syntax-and-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install tools
        run: pip install PyYAML
      - name: Python compileall
        run: |
          python -m compileall -q \
            src/vision_arm_control/src \
            src/vision_arm_control/scripts \
            tests \
            benchmarks \
            scripts
      - name: Parse YAML configs
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          paths = list(Path("src/vision_arm_control/config").glob("*.yaml"))
          assert paths, "no yaml configs"
          for p in paths:
              yaml.safe_load(p.read_text())
              print("ok", p)
          PY
      - name: Parse launch XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for p in Path("src/vision_arm_control/launch").glob("*.launch"):
              root = ET.parse(p).getroot()
              assert root.tag == "launch", p
              print("ok", p)
          PY
      - name: Guard against personal paths
        run: |
          # Active code/config only (audit docs may mention historical paths)
          if grep -RIn --exclude-dir=.git \
              --include='*.py' --include='*.yaml' --include='*.launch' --include='*.xml' --include='*.txt' --include='*.cmake' \
              '/home/edr' src scripts docker scholar tests 2>/dev/null ; then
            echo "Found forbidden personal absolute paths in active code" >&2
            exit 1
          fi
          if grep -RIn 'your_email@example.com\|Your Name\|yourusername' \
              src/vision_arm_control/package.xml src/vision_arm_control/CMakeLists.txt \
              src/vision_arm_control/config src/vision_arm_control/launch 2>/dev/null ; then
            echo "Found placeholder metadata" >&2
            exit 1
          fi
      - name: Guard clean src/ layout
        run: |
          # Only the maintained package should live under src/
          python - <<'PY'
          from pathlib import Path
          src = Path("src")
          entries = sorted(p.name for p in src.iterdir() if p.name != ".git")
          assert entries == ["vision_arm_control"], f"unexpected src entries: {entries}"
          print("src/ clean:", entries)
          assert not Path(".gitmodules").exists(), ".gitmodules present but submodules are intentionally not used"
          PY
      - name: Guard no binary weights in working tree
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden_ext = {".pth", ".pt", ".onnx", ".bag"}
          bad = []
          for p in Path(".").rglob("*"):
              if ".git" in p.parts:
                  continue
              if p.is_file() and p.suffix.lower() in forbidden_ext:
                  bad.append(str(p))
          if bad:
              raise SystemExit(f"Forbidden binary artifacts present: {bad}")
          # Explicit weights/ directory must not hold tracked model files
          weights = Path("src/vision_arm_control/weights")
          if weights.is_dir():
              model_files = [str(p) for p in weights.rglob("*") if p.is_file() and p.suffix.lower() in forbidden_ext]
              if model_files:
                  raise SystemExit(f"weights/ still contains models: {model_files}")
          print("no binary weights/bags in working tree")
          PY
