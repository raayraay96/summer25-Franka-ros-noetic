  <path d="M340 135 H370" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="370" y="100" width="150" height="70" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
