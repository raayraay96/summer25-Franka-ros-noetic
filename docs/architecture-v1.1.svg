  <path d="M625 170 V200 H450 V230" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <text x="28" y="350" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">* optional_moveit only if verified — not default. No physical Franka claim.</text>
