  <text x="100" y="130" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Landmark</text>
  <text x="100" y="150" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Source</text>

  <path d="M170 135 H200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="200" y="100" width="140" height="70" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="270" y="130" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Confidence</text>
