  <text x="445" y="145" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">shoulder_relative</text>
  <text x="445" y="160" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">sew_orientation</text>

  <path d="M520 135 H550" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="550" y="100" width="150" height="70" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="625" y="125" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Safety Filter</text>
  <text x="625" y="145" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">reject · clamp</text>
  <text x="625" y="160" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">cbf_qp (exp.)</text>

  <path d="M700 135 H730" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="730" y="100" width="150" height="70" rx="10" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
  <text x="805" y="125" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Backend</text>
  <text x="805" y="145" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">dry_run (default)</text>
  <text x="805" y="160" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">ros2_fake · MoveIt*</text>

  <rect x="200" y="230" width="500" height="70" rx="10" fill="#111827" stroke="#475569" stroke-width="2"/>
